# A webhook receiver, for proving that notifications actually leave the
# building.
#
# This is the test everybody skips. A notifier that discovers updates and
# cannot deliver them is indistinguishable, from the outside, from one that
# found nothing — both are silent, and silence is what you expect most days.
# The first time you learn the difference is the day it mattered.
#
# So: a container that accepts a POST and writes the body to its log, Diun
# pointed at it, and first-check notification turned on so the very first scan
# has something to say. The test then asserts the sink received a message that
# names Diun.
#
#   docker compose \
#     -f diun-docker-compose.yml \
#     -f tests/webhook-sink.yml \
#     -p diun up -d
#
# Not for production. It has no authentication, keeps nothing, and exists only
# to be asked "did anything arrive?".
#
# IT SERVES ONE CONNECTION AT A TIME. BusyBox nc has no concurrency, and the
# first scan posts one notification per discovered image within the same
# second - so the first arrives and the rest are refused while nc is restarting
# between accepts. Diun logs those refusals, and they are the instrument's
# limit rather than a defect in the delivery path. The test asserts that a POST
# arrived, which is the question worth asking: a notifier that discovers
# updates and cannot deliver them is, from the outside, indistinguishable from
# one that found nothing.
services:
  webhook-sink:
    image: ${DIUN_BACKUPS_IMAGE_TAG:-alpine:${DIUN_BACKUPS_IMAGE_VERSION:-3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce}}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.5"
        reservations:
          memory: 8m
          cpus: "0.1"
    # BusyBox nc, one request at a time, in a loop. A real HTTP server would be
    # a second language in this repository for no gain: the assertion is "a
    # POST arrived and it mentions Diun", and nc can answer that.
    #
    # THE REQUEST IS PRINTED BY A SHELL READ LOOP, NOT BY `tr | sed`. That
    # matters, and it took a raw capture to see why. nc receives the whole
    # request: teeing its output to a file gave all 669 bytes of Diun's POST,
    # headers and body, and running the old `tr -d '\r' | sed 's/^/SINK /'`
    # over that file printed every line. Yet live, with nc still holding the
    # pipe open, the container log carried the request line and nothing else,
    # so the test looked for a Content-Type that had arrived and been swallowed
    # between two processes. A read loop writes each line as it reads it and
    # the whole request reaches the log.
    #
    # NO -w HERE EITHER. A listen timeout counts from the moment nc starts
    # listening rather than from the moment a connection arrives, so it can cut
    # an accepted request part way through. The loop restarts nc anyway and the
    # CI step carries its own timeout.
    command: ["sh", "-c", "while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 9000 | while IFS= read -r line; do echo \"SINK $${line%$$(printf '\r')}\"; done; done"]
    # THE LISTENER IS BOUND, not merely the container started. `depends_on:
    # service_started` means the process was launched; Diun's first scan fires
    # within a second of its own start and posts immediately, so it raced this
    # container's nc to the port and lost. Every notification in that first
    # burst was refused with "connection refused", and because a first check
    # only happens once there was nothing to retry: the test then waited six
    # minutes for a message that was never going to be sent again.
    #
    # netstat rather than a connection: probing a listener that serves one
    # request at a time by connecting to it would consume the accept the real
    # notification needs. This reads the socket without touching it.
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':9000'"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    networks:
      - diun-network
    restart: unless-stopped

  diun:
    environment:
      # The whole point of the sink.
      DIUN_WEBHOOK_URL: http://webhook-sink:9000/hook
      # Every minute, and tell me about the first scan: without both of these
      # the test would wait until tomorrow morning for a message that, by
      # design, is not sent about images seen for the first time.
      DIUN_WATCH_SCHEDULE: "*/1 * * * *"
      DIUN_WATCH_FIRSTCHECKNOTIF: "true"
    depends_on:
      webhook-sink:
        # Healthy, not started. See the healthcheck above for what that
        # distinction cost.
        condition: service_healthy
