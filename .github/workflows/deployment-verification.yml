name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: diun
            env_var: DIUN_IMAGE_TAG
          - name: dockerproxy
            env_var: DIUN_DOCKERPROXY_IMAGE_TAG
          - name: backups
            env_var: DIUN_BACKUPS_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\$\\{${ENV_VAR}:-.*" diun-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  deploy-and-test:
    name: docker compose up + discovery, delivery and socket isolation + backup validity
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      NETWORK_ONE: diun-network
      DOCKER_COMPOSE_FILE: diun-docker-compose.yml
      # Compose reads COMPOSE_FILE itself, colon-separated, so every `docker
      # compose` below picks up both files without a flag - and without an
      # unquoted variable that has to word-split to work. The sink is how this
      # job finds out whether notifications actually leave the building; the
      # end-to-end script passes its own -f and is unaffected.
      COMPOSE_FILE: diun-docker-compose.yml:tests/webhook-sink.yml
      COMPOSE_PROJECT_NAME: diun

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the Docker network
        run: docker network create "$NETWORK_ONE" || true

      - name: Generate test .env with ephemeral credentials
        # The real .env is gitignored. CI generates throwaway credentials so
        # `docker compose up` succeeds without committing secrets to the
        # repo. No *_IMAGE_TAG values on purpose: the compose file's
        # x-images defaults apply, so CI always tests exactly the pins the
        # template ships to users who run it unmodified.
        run: |
          cat > .env <<EOF
          # Overridden by tests/webhook-sink.yml, which points Diun at the sink.
          # Present anyway because the compose file requires it: a notifier with
          # nowhere to notify should not start.
          DIUN_WEBHOOK_URL=http://webhook-sink:9000/hook
          BACKUP_INIT_SLEEP=15s
          BACKUP_INTERVAL=60s
          EOF
          # The media mount defaults to ./media; CI has no library, and an
          # empty directory is the honest stand-in - it proves the mount works
          # without pretending there is content to scan.
          mkdir -p media
          echo "Generated ephemeral .env for CI run"

      - name: Upgrade drill — the previous release comes up first, on the volumes this run will upgrade
        # A fresh stack proves the new image starts. It proves nothing about the
        # data a deployed host already has: whether the new database image accepts
        # the old data directory, whether the application's migrations run on a
        # populated schema. So the previous release is started first, on this
        # project's volumes, and the ordinary `up -d` below then recreates the
        # changed containers on top of it - which is exactly what `git pull &&
        # docker compose up -d` does on a deployed host. Every smoke check that
        # follows judges the upgraded stack, not a fresh one.
        run: |
          prev="$(git ls-remote --tags --sort=-v:refname origin 'v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
          if [ -z "$prev" ]; then
            echo "no previous release: nothing to upgrade from, the fresh start below is the whole test"
            exit 0
          fi
          git fetch --depth=1 --quiet origin "refs/tags/$prev:refs/tags/$prev"
          if git diff --quiet "$prev" -- "$DOCKER_COMPOSE_FILE"; then
            echo "the compose file is unchanged since $prev: nothing to drill"
            exit 0
          fi
          git show "$prev:$DOCKER_COMPOSE_FILE" > .upgrade-drill-previous.yml
          echo "starting $prev on this project's volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" up -d
          # Healthy means: every container is running and healthy (or running
          # with no health check), or exited 0 (a one-shot init container).
          bad=""
          for _ in $(seq 1 60); do
            bad="$(docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" ps -a --format json \
              | jq -rs '[.[] | select((.State == "running" and (.Health == "" or .Health == "healthy")) or (.State == "exited" and .ExitCode == 0) | not)] | map("\(.Service):\(.State)/\(.Health)") | join(" ")')"
            [ -z "$bad" ] && break
            sleep 10
          done
          if [ -n "$bad" ]; then
            echo "::error::the previous release ($prev) did not come up with this run's .env: $bad. Either the variable contract changed - then the changelog must say so - or $prev was never green here."
            docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" logs --tail 80
            exit 1
          fi
          echo "$prev is up and healthy; stopping it and keeping its volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" down
          rm -f .upgrade-drill-previous.yml
          echo "the start below is now an upgrade from $prev"

      - name: Start up services using Docker Compose
        run: docker compose -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Print Docker Compose services status
        run: docker ps

      - name: Diun discovers what is running, through the read-only proxy
        # The assertion the proxy's allow-list exists for. Diun lists containers
        # and then INSPECTS EACH IMAGE to learn its digest; without IMAGES on
        # the allow-list it lists everything successfully, gets a 403 on every
        # inspect, and logs "No image found" - a stack that is healthy, running,
        # and watching nothing at all.
        #
        # This waits for a scan that FOUND something rather than judging the
        # first one. Diun scans once the moment it starts, which on a stack
        # coming up together can beat the proxy to readiness: the first run of
        # this job saw `added=0 failed=0`, meaning it had scanned nothing at
        # all, and called that a defect. A scan that races container startup is
        # expected; a stack that never discovers anything is not.
        run: |
          dc() { docker compose -p "$COMPOSE_PROJECT_NAME" "$@"; }
          strip() { sed "s/\x1b\[[0-9;]*m//g"; }
          added=0
          for _ in $(seq 1 36); do
            added=$(dc logs diun 2>/dev/null | strip | grep -oE "added=[0-9]+" | cut -d= -f2 | sort -rn | head -1)
            [ "${added:-0}" -gt 0 ] && break
            echo "Waiting for a scan that finds something..."
            sleep 10
          done
          dc logs diun | strip | grep "Jobs completed" | tail -2
          if [ "${added:-0}" -eq 0 ]; then
            echo "::error::no scan ever discovered an image"
            dc logs diun | strip | grep -m3 -iE "no image found|cannot inspect|cannot create docker client" || true
            exit 1
          fi
          echo "images discovered: $added"

      - name: A notification actually leaves the building
        # The test nobody writes. A notifier that discovers updates and cannot
        # deliver them is, from the outside, identical to one that found
        # nothing: both are silent, and silence is what you expect most days.
        # tests/webhook-sink.yml receives one, and that is the whole assertion.
        run: |
          dc() { docker compose -p "$COMPOSE_PROJECT_NAME" "$@"; }
          # Wait for the line this step is about to assert on, not for a
          # different one. The sink's output reaches the log through a
          # buffered pipeline, so "SINK POST" can be visible a moment before
          # the headers that followed it are, and a grep fired the instant the
          # POST line appeared failed on a notification that had arrived
          # perfectly well.
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -p "$COMPOSE_PROJECT_NAME" logs webhook-sink 2>/dev/null | grep -q "SINK Content-Type: application/json"; do
            echo "Waiting for a notification to arrive..."; sleep 10
          done'
          dc logs webhook-sink | grep -m6 "SINK"
          dc logs webhook-sink | grep -q "SINK POST" \
            || { echo "::error::headers arrived at the sink but no request line did"; exit 1; }
          echo "a JSON notification was delivered"

      - name: Diun never gets the Docker socket, and the proxy refuses writes
        run: |
          dc() { docker compose -p "$COMPOSE_PROJECT_NAME" "$@"; }
          mounts=$(docker inspect "$(dc ps -q diun)" --format '{{range .Mounts}}{{.Source}} {{end}}')
          echo "diun mounts: $mounts"
          case "$mounts" in
            *docker.sock*) echo "::error::the Diun container has the Docker socket mounted"; exit 1 ;;
          esac
          echo "the Diun container has no Docker socket"
          probe() {
            dc exec -T backups sh -c "wget -q -O /dev/null -S $1 2>&1" \
              | grep -m1 -oE 'HTTP/[0-9.]+ [0-9]+' | grep -oE '[0-9]+$' || true
          }
          write=$(probe '--post-data "" "http://dockerproxy:2375/containers/nonexistent/restart"')
          read=$(probe '"http://dockerproxy:2375/containers/json"')
          echo "through the proxy: POST restart -> ${write:-no answer}, GET containers/json -> ${read:-no answer}"
          [ "$write" = "403" ] || { echo "::error::the proxy answered ${write:-nothing} to a POST; it is not read-only"; exit 1; }
          [ "$read" = "200" ] || { echo "::error::the proxy answered ${read:-nothing} to a GET; Diun cannot see containers"; exit 1; }
          echo "the daemon is readable and not writable through the proxy"

      - name: Verify a backup is produced and valid
        # Log-driven: the file named in a 'backup OK' line has already been
        # read back by the loop itself, so this never races a cycle that is
        # still writing.
        run: |
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -q "Data backup OK"; do echo "Waiting for the first backup cycle..."; sleep 10; done'
          data=$(docker compose -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Data backup OK" | tail -1 | sed -E 's/.*Data backup OK: ([^ ]+) .*/\1/')
          [ -n "$data" ] || { echo "::error::no 'Data backup OK' line - the archive failed"; exit 1; }
          echo "Data backup file: $data"
          docker compose -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "tar -tzf '$data' > /dev/null && tar -tzf '$data' | grep -q '^config/'" \
            && echo "Data backup valid and carries the data directory: $data"
          docker compose -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        # Eight scenarios against the live stack: required-env guard, backup
        # produced, readable, valid content, library archive readable, failure
        # detected when the database is down, restore genuinely replaces state,
        # prune keeps recent files. Same script a maintainer runs locally.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: Diun comes back on the restored data directory
        # The end-to-end test above empties the data directory and unpacks an
        # archive over it while the container is stopped. A restore that leaves
        # the database in a state Diun rejects passes every check up to here and
        # fails the first time somebody actually needs it.
        run: |
          dc() { docker compose -p "$COMPOSE_PROJECT_NAME" "$@"; }
          dc restart diun
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until [ "$(docker inspect "$(docker compose -p "$COMPOSE_PROJECT_NAME" ps -q diun)" --format "{{.State.Health.Status}}")" = "healthy" ]; do
            echo "Waiting for Diun on the restored data..."; sleep 10
          done'
          echo "Diun came back healthy on the restored data directory"

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" down
